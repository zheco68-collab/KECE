name: CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'judger/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'judger/**'
      - '.github/workflows/**'

jobs:
  frontend:
    name: Frontend (Lint + Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit -- --run

  backend:
    name: Backend (Test + Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make mvnw executable
        run: chmod +x mvnw
      - run: ./mvnw -B spotless:check
      - run: ./mvnw -B test
      - run: ./mvnw -B package -DskipTests

  judger:
    name: Judger (Lint + Test + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: judger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: gofmt -l . | grep -q . && exit 1 || true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/judger ./cmd/judger
